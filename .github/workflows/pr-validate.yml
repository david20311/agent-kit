# Gate 2: Unabhängige Prüfung jedes Pull Requests – der Agent kann sich hier nicht selbst freigeben.
# Reusable workflow – Projekt-Repos rufen ihn bei pull_request auf main auf (Vorlage: templates/project-pr-validate.yml).
name: PR-Validierung (agent-kit)

on:
  workflow_call:
    secrets:
      SF_AUTH_URL_AGENT_INT:
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate 1 prüfen (Design freigegeben?)
        run: |
          TICKET=$(echo "${{ github.head_ref }}" | sed -n 's#^feature/##p')
          if [ -n "$TICKET" ] && [ -f "docs/design/$TICKET.md" ]; then
            grep -q "^Status: Freigegeben" "docs/design/$TICKET.md" || {
              echo "::error::Design-Dokument $TICKET ist nicht freigegeben."; exit 1; }
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Werkzeuge installieren
        run: |
          npm install -g @salesforce/cli
          sf plugins install code-analyzer

      - name: Integrations-Sandbox authentifizieren
        run: |
          echo "${{ secrets.SF_AUTH_URL_AGENT_INT }}" > /tmp/auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/auth.txt --alias agent-int
          rm /tmp/auth.txt

      - name: Statische Analyse
        run: sf code-analyzer run --target force-app --severity-threshold 2 --output-file analyzer.html

      - name: Validierungs-Deployment mit allen lokalen Tests
        run: |
          sf project deploy validate --source-dir force-app --target-org agent-int \
            --test-level RunLocalTests --coverage-formatters json-summary --wait 60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyzer-report
          path: analyzer.html
